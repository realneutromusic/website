<!-- Every release, newest first, with search. The home page shows the latest
     eight and links here ("View Full Catalogue"). Card, release window and
     cover loading are copied from index.html so both look the same: when the
     release card or window changes there, change it here too. -->
<script>
  // Same source as the home page: the admin panel, then this browser's last
  // list, then the old releases.json (see window.__releasesPromise in index.html).
  window.__releasesPromise = (function () {
    var KEY = 'nt_releases_v1';
    var json = function (url) {
      return fetch(url, { cache: 'no-store' }).then(function (res) {
        if (!res.ok) throw new Error('releases request failed: ' + res.status);
        return res.json();
      });
    };
    return json('https://store.realneutromusic.com/api/releases')
      .then(function (data) {
        if (!data || !Array.isArray(data.releases) || !data.releases.length) throw new Error('no releases');
        try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* no storage */ }
        return data;
      })
      .catch(function () {
        try { var saved = JSON.parse(localStorage.getItem(KEY)); if (saved && saved.releases && saved.releases.length) return saved; } catch (e) { /* no storage */ }
        return json('/releases.json?v=' + Date.now());
      });
  })();
</script>

<style>
  :root {
    --bg: #04070d;
    --surface: #0c1424;
    --surface-2: #16263f;
    --line: #1d3050;
    --ink: #eef3fa;
    --ink-dim: #9fb4cf;
    --ink-faint: #5b7299;
    --steel: #4f7bb0;
    --steel-bright: #a8c8ec;
    --steel-deep: #2c4d7a;
    --steel-soft: rgba(79,123,176,0.16);
    --ease: cubic-bezier(.22, 1, .36, 1);
    --ease-spring: cubic-bezier(.34, 1.45, .64, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background-color: var(--bg);
    color: var(--ink);
    font-family: 'Sora', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--steel-bright); outline-offset: 3px; }
  ::selection { background: var(--steel); color: #04070d; }

  .display { font-family: 'Unbounded', sans-serif; }
  .display-xl { font-family: 'Unbounded', sans-serif; font-weight: 900; letter-spacing: -0.02em; }
  .mono { font-family: 'JetBrains Mono', monospace; }

  .wrap { max-width: 1100px; margin: 0 auto; padding-left: 32px; padding-right: 32px; }
  @media (max-width: 640px) { .wrap { padding-left: 20px; padding-right: 20px; } }

  .skip-link {
    position: absolute; left: -9999px; top: 0;
    background: var(--steel-bright); color: #04070d;
    padding: 10px 16px; font-size: 13px; font-weight: 600; z-index: 200;
  }
  .skip-link:focus { left: 16px; top: 16px; }

  /* flat card */
  .card {
    position: relative;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: var(--surface);
    transition: border-color 0.35s var(--ease), box-shadow 0.4s var(--ease), transform 0.35s var(--ease);
  }



  /* ---------- section scaffolding ---------- */
  /* only top/bottom: the shorthand "90px 0" also wiped .wrap's side padding, so below ~1160px wide
     every section touched the edges of the window */
  .block { padding-top: 90px; padding-bottom: 90px; border-top: 1px solid var(--line); }
  .block-head {
    margin-bottom: 44px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 20px; flex-wrap: wrap;
  }
  .block-head-left .tag {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--steel-bright); margin-bottom: 10px;
  }
  .block-head-left .tag::before { content: ''; width: 14px; height: 1px; background: var(--steel-bright); }
  .block-head h2 { font-family: 'Unbounded', sans-serif; font-size: clamp(2.2rem, 5vw, 3.2rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  .block-head .sub { display: block; margin-top: 10px; font-size: 14px; color: var(--ink-dim); max-width: 420px; }
  .block-count {
    font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-faint);
    border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; flex-shrink: 0;
  }
  .block-count b { color: var(--ink-dim); font-weight: 500; }

  /* ---------- RELEASES: flat grid ---------- */
  /* flexbox instead of grid on purpose: with CSS Grid's auto-fill, a
     leftover row (5 releases = a full row of 4 plus 1 alone) sits that
     lone card in the grid's first column — stuck at the left edge — since
     grid doesn't re-center partial rows on its own. Flexbox with wrap +
     justify-content:center centers whatever is left over in the last row
     automatically, whether that's 1 release or 3, without needing to know
     the total count in advance. */
  /* flexbox + wrap, centered. The per-card width itself (flex-basis) is
     set dynamically by layoutReleaseGrid() in JS below, which picks a
     column count based on the actual release count so a leftover row
     never ends up with a single stretched-huge orphan card — see the
     comment on that function for the full reasoning. */
  .release-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 22px;
    padding-top: 6px;
  }

  .release-card.card {
    padding: 0;
    overflow: visible;
    opacity: 0;
    cursor: pointer;
    transform: translateY(14px);
    transition: border-color 0.3s var(--ease), box-shadow 0.4s var(--ease), transform 0.45s var(--ease-spring);
    /* flex-basis (width) is set per-card by layoutReleaseGrid() in JS —
       this flex-shrink:0 just stops cards from being unwillingly squeezed
       smaller than the width JS computed for them if something unexpected
       eats into the row's available space. */
    flex-shrink: 0;
  }
  /* will-change only while the card is actually animating (entrance or
     hover) — see JS below. Keeping it on permanently forces the browser
     to promote every single release card to its own composited layer for
     the whole lifetime of the page, which is exactly the kind of cost
     that piles up the first time several cards enter the viewport at
     once (new tab, nothing cached yet). */
  .release-card.card.will-animate {
    will-change: transform;
  }
  .release-card.in-view {
    opacity: 1;
    transform: translateY(0);
    animation: cardReveal 0.55s var(--ease) forwards;
  }
  @keyframes cardReveal { to { opacity: 1; transform: translateY(0); } }

  .release-card:hover {
    border-color: var(--steel);
    box-shadow: 0 26px 50px -20px rgba(0,0,0,0.65);
    transform: translateY(-8px);
  }
  .release-card:focus-visible { outline: 2px solid var(--steel-bright); outline-offset: 2px; }

  /* ---------- reworked card: catalog badge pinned over the top-left
     corner of the cover (the numbering is part of the brand, so it stays
     visible without opening anything), a play-hint that pops in on hover
     to signal "click me", and the title/artist living OUTSIDE the art in
     their own row — the modal is still where the full detail lives. ---- */
  .release-art-stage {
    position: relative; width: 100%; aspect-ratio: 1 / 1;
    /* defensive cap, not the main mechanism anymore — layoutReleaseGrid()
       in JS now picks column counts that avoid a lone stretched-huge
       orphan card in the first place. This just stays as a safety net in
       case JS hasn't run yet, or in the rare count where an orphan is
       genuinely unavoidable (see that function's comment). */
    max-height: 260px;
    overflow: hidden;
    border-radius: 16px;
    transform: translateZ(0);
    isolation: isolate;
  }
  .release-art-img {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    filter: saturate(0.92) brightness(0.86);
    transition: filter 0.45s var(--ease), transform 0.6s var(--ease-spring);
  }
  .release-card:hover .release-art-img { filter: saturate(1.08) brightness(0.62); transform: scale(1.09) rotate(-0.6deg); }

  .release-catalog-badge {
    position: absolute; top: 10px; left: 10px; z-index: 2;
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em;
    color: var(--ink);
    background: rgba(4,7,13,0.55);
    border: 1px solid rgba(238,243,250,0.2);
    backdrop-filter: blur(6px);
    padding: 5px 10px;
    border-radius: 999px;
    transition: background 0.3s var(--ease), border-color 0.3s var(--ease), transform 0.4s var(--ease-spring);
  }
  .release-card:hover .release-catalog-badge {
    background: var(--steel);
    color: #04070d;
    border-color: var(--steel);
    transform: translateY(-2px) scale(1.05);
  }

  .release-play-hint {
    position: absolute; inset: 0; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.35s var(--ease), transform 0.4s var(--ease-spring);
    transform: scale(0.6) rotate(-8deg);
  }
  .release-card:hover .release-play-hint { opacity: 1; transform: scale(1) rotate(0deg); }
  .release-play-hint span {
    width: 52px; height: 52px; border-radius: 50%;
    background: rgba(4,7,13,0.55); backdrop-filter: blur(6px);
    border: 1.5px solid rgba(238,243,250,0.4);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 30px -8px rgba(0,0,0,0.6);
  }
  .release-play-hint svg { width: 18px; height: 18px; fill: var(--ink); margin-left: 2px; }

  .release-card-meta {
    padding: 16px 14px 15px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .release-title {
    font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 14px;
    letter-spacing: -0.005em; line-height: 1.3; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color 0.3s var(--ease);
  }
  .release-card:hover .release-title { color: var(--steel-bright); }
  .release-artist {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 500; color: var(--ink-faint);
    letter-spacing: 0.005em; line-height: 1.3;
  }
  .release-artist .person-icon { width: 11px; height: 11px; flex-shrink: 0; opacity: 0.6; fill: currentColor; }
  .release-artist .artist-text { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .release-artist a { color: var(--steel-bright); text-decoration: none; }
  .release-artist a:hover { text-decoration: underline; text-underline-offset: 2px; color: var(--ink); }

  .release-art-stage::after {
    content: '';
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(115deg, transparent 42%, rgba(238,243,250,0.65) 50%, transparent 58%);
    transform: translateX(-140%) rotate(6deg);
    opacity: 0;
  }
  .release-card:hover .release-art-stage::after {
    animation: releaseLightLeak 0.85s var(--ease) forwards;
  }
  @keyframes releaseLightLeak {
    0% { transform: translateX(-140%) rotate(6deg); opacity: 0; }
    18% { opacity: 0.85; }
    100% { transform: translateX(140%) rotate(6deg); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .release-card:hover .release-art-stage::after { animation: none; }
  }

  /* ---------- release detail modal — click a card, see the full picture,
     no inline embed cluttering the grid itself ---------- */
  .release-modal-backdrop {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(4,7,13,0.78);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    opacity: 0; pointer-events: none;
    /* no blur while closed: the invisible full-screen backdrop blur was still
       computed every frame (Chrome without GPU: ~48 → ~65 fps). It fades with
       the opacity. Not visibility:hidden — the close button inherits it through
       its own transition and could not take focus right when the window opens. */
    backdrop-filter: none;
    transition: opacity 0.3s var(--ease), backdrop-filter 0.3s var(--ease);
  }
  .release-modal-backdrop.visible { opacity: 1; pointer-events: auto; backdrop-filter: blur(6px); }
  .release-modal {
    position: relative; width: 100%; max-width: 520px;
    background: var(--surface-solid, #0c1424);
    border: 1px solid var(--line); border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 50px 100px -30px rgba(0,0,0,0.85);
    transform: translateY(14px) scale(0.98);
    transition: transform 0.35s var(--ease-spring);
    max-height: 88vh; overflow-y: auto;
  }
  .release-modal-backdrop.visible .release-modal { transform: translateY(0) scale(1); }
  .release-modal-art {
    position: relative; width: 100%; aspect-ratio: 5 / 4;
    background-size: cover; background-position: center;
  }
  .release-modal-catalog-badge {
    position: absolute; top: 14px; left: 14px; z-index: 2;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em;
    color: var(--ink);
    background: rgba(4,7,13,0.55);
    border: 1px solid rgba(238,243,250,0.2);
    backdrop-filter: blur(6px);
    padding: 5px 10px;
    border-radius: 999px;
  }
  .release-modal-art::after {
    content: ''; position: absolute; inset: 0;
    /* fade starts right from the top now instead of holding fully
       transparent until 20% — on a bright, high-contrast cover (lots of
       light blues/whites near the bottom, not just dark ones) the old
       20%-to-100% range compressed the whole brightness drop into a
       shorter stretch, which reads as a visible edge even though the
       color values themselves step smoothly. Spreading the same fade
       across the full height gives it more room to be gradual on any
       cover, bright or dark. */
    background: linear-gradient(to bottom,
      transparent 0%,
      rgba(12,20,36,0.05) 15%,
      rgba(12,20,36,0.14) 32%,
      rgba(12,20,36,0.28) 48%,
      rgba(12,20,36,0.48) 62%,
      rgba(12,20,36,0.7) 75%,
      rgba(12,20,36,0.88) 88%,
      var(--surface-solid, #0c1424) 100%
    );
  }
  .release-modal-close {
    position: absolute; top: 14px; right: 14px; z-index: 2;
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(4,7,13,0.6); backdrop-filter: blur(4px);
    border: 1px solid rgba(238,243,250,0.2);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--ink);
    transition: all 0.2s var(--ease);
  }
  .release-modal-close:hover { background: var(--steel); border-color: var(--steel); color: #04070d; }
  .release-modal-close svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; }

  .release-modal-body {
    padding: 22px 26px 26px;
  }
  .release-modal-tags { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .release-modal-title {
    font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 25px; letter-spacing: -0.01em; line-height: 1.15;
    margin-top: 10px;
  }
  .release-modal-collab { font-size: 13.5px; color: var(--ink-dim); margin-top: 6px; }
  .release-modal-collab a { color: var(--steel-bright); text-decoration: underline; text-underline-offset: 2px; }
  .release-modal-collab a:hover { color: var(--ink); }
  .release-modal-imprint {
    display: none; align-items: center;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: #f5c542;
    background: rgba(245,197,66,0.12);
    border: 1px solid rgba(245,197,66,0.35);
    padding: 5px 12px;
    border-radius: 999px;
  }
  .release-modal-imprint.visible { display: inline-flex; }

  .release-modal-divider { height: 1px; background: var(--line); margin: 20px 0; }
  .release-modal-listen-label {
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-faint); margin-bottom: 12px; display: block;
  }
  .release-modal-links { display: flex; flex-wrap: wrap; gap: 10px; }
  .release-modal-links a {
    flex: 1 1 calc(50% - 5px);
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px 10px 10px;
    border: none; border-radius: 999px;
    background: rgba(238,243,250,0.06);
    font-size: 13.5px; font-weight: 700; color: var(--ink);
    transition: all 0.25s var(--ease-spring);
  }
  .release-modal-links a:hover { background: rgba(238,243,250,0.13); transform: translateY(-2px); }
  .release-modal-links a .link-icon {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgb(var(--brand-rgb));
  }
  .release-modal-links a .link-icon svg { width: 15px; height: 15px; fill: #04070d; }
  .release-modal-links a .link-icon.apple-music svg .am-ring,
  .release-modal-links a .link-icon.apple-music svg .am-stem { stroke: #04070d; }
  .release-modal-links a .link-icon.apple-music svg .am-note { fill: #04070d; }
  .release-modal-links a span.name { flex: 1; }
  .release-modal-links a .ext-icon { width: 12px; height: 12px; fill: none; stroke: var(--ink-faint); stroke-width: 2; flex-shrink: 0; }


  /* ---------- catalogue page ---------- */
  .cat-top {
    position: relative; z-index: 3;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding-top: 26px; padding-bottom: 26px; border-bottom: 1px solid var(--line);
  }
  .cat-back { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-dim); transition: color 0.2s; }
  .cat-back:hover { color: var(--ink); }
  .cat-logo { font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 0.08em; }
  .cat-top-spacer { width: 120px; }
  .cat-main.block { border-top: 0; padding-top: 64px; }
  .block-head h1 { font-family: 'Unbounded', sans-serif; font-size: clamp(2.2rem, 5vw, 3.2rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  .cat-tools { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: -18px 0 30px; }
  .cat-search {
    position: relative; flex: 0 1 360px; min-width: 0;
  }
  .cat-search svg { position: absolute; left: 14px; top: 50%; width: 15px; height: 15px; transform: translateY(-50%); fill: none; stroke: var(--ink-faint); stroke-width: 2; pointer-events: none; }
  .cat-search input {
    width: 100%; padding: 11px 14px 11px 38px; border-radius: 12px;
    border: 1px solid var(--line); background: rgba(12,20,36,0.55); color: var(--ink);
    font: 14px 'Sora', sans-serif; transition: border-color 0.2s;
  }
  .cat-search input::placeholder { color: var(--ink-faint); }
  .cat-search input:focus { outline: none; border-color: var(--steel); }
  .cat-search input:focus-visible { outline: 2px solid var(--steel-bright); outline-offset: 2px; }
  /* Same small link as "View Full Catalogue" on the home page, right above the top-right card. */
  .cat-releases {
    margin-left: auto; font-size: 12px; color: var(--steel-bright); padding: 6px 2px;
    border-bottom: 1px solid transparent; transition: color 0.2s, border-color 0.2s;
  }
  .cat-releases::before { content: '← '; }
  .cat-releases:hover { color: var(--ink); border-bottom-color: var(--ink-faint); }
  .release-card.card[hidden] { display: none; }
  /* Card size comes from the whole catalogue; search results line up from the left. */
  .release-grid { justify-content: flex-start; }
  .cat-empty { color: var(--ink-dim); font-size: 14px; padding: 40px 0; text-align: center; }
  @media (max-width: 640px) {
    .cat-top-spacer { display: none; }
    .cat-main.block { padding-top: 44px; }
    .cat-search { flex-basis: 100%; }
  }
</style>

<body>
<header class="cat-top wrap">
  <a class="cat-back mono" href="/">← Back to Home</a>
  <a class="cat-logo" href="/" aria-label="Neutro — home">NEUTRO</a>
  <span class="cat-top-spacer" aria-hidden="true"></span>
</header>

<main class="block wrap cat-main" id="releases">
  <div class="block-head">
    <div class="block-head-left">
      <div class="tag mono">Discography</div>
      <h1>Full Catalogue</h1>
      <span class="sub" id="cat-sub">Every release, newest first</span>
    </div>
  </div>
  <div class="cat-tools">
    <label class="cat-search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5" stroke-linecap="round"/></svg>
      <input type="search" id="cat-q" placeholder="Search title or artist…" aria-label="Search releases by title or artist" autocomplete="off">
    </label>
    <span class="block-count mono" aria-live="polite"><b id="release-count">0</b> <span id="release-word">releases</span></span>
    <a class="cat-releases mono" href="/#releases">Back to Releases</a>
  </div>
  <div class="release-grid" id="release-grid"></div>
  <p class="cat-empty" id="cat-empty" hidden>No releases match your search.</p>
</main>

<script>
(function(){
  "use strict";
  let RELEASES = [];
  const THUMB_PX = 720;
  const lightCovers = new Map(); // full artwork URL → light copy that loaded
  // Text and links from releases go into HTML: escape the text, keep only https links.
  const escHtml = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function safeLink(v) {
    try { const u = new URL(String(v || '')); return u.protocol === 'https:' ? u.href.replace(/"/g, '%22') : ''; } catch (e) { return ''; }
  }
  function loadCover(thumb, full, el) {
    const px = el ? Math.max(el.clientWidth, el.clientHeight) * (window.devicePixelRatio || 1) : 0;
    const wanted = thumb && px && px <= THUMB_PX;
    // Covers from the panel come with their light copy's exact URL (made together): no size check needed.
    const direct = wanted && /^https:\/\//.test(thumb);
    const size = wanted && !direct
      ? fetch(full, { method: 'HEAD' }).then(res => (res.ok ? res.headers.get('Content-Length') : null)).catch(() => null)
      : Promise.resolve(null);
    return size.then(bytes => new Promise(resolve => {
      const light = direct ? thumb : bytes ? thumb.replace(/\.webp$/, `-${bytes}.webp`) : '';
      const attempt = (url, fallback) => {
        const img = new Image();
        img.onload = () => (img.decode ? img.decode().catch(() => {}) : Promise.resolve()).then(() => {
          if (url === light) lightCovers.set(full, light);
          resolve(url);
        });
        img.onerror = () => (fallback ? attempt(fallback, null) : resolve(url));
        img.src = url;
      };
      attempt(light || full, light ? full : null);
    }));
  }

  async function loadReleases() {
    // The actual network request already started as early as possible, in
    // a tiny script at the top of <head> (see the comment there) — this
    // just waits on that same promise instead of firing a second,
    // redundant fetch this late in the page's life.
    const data = await window.__releasesPromise;
    const list = Array.isArray(data) ? data : (data.releases || []);
    // From the panel, "image"/"thumb"/"audio" are full https URLs (cover 1200 px,
    // light copy 640 px, optional preview); from the old releases.json, "image"
    // is a file name in ./assets/ and the light copy is found by size (loadCover).
    const remote = (v) => /^https:\/\//.test(String(v || ''));
    RELEASES = list.map((r) => ({
      catalog: r.catalog,
      title: r.title,
      artist: r.artist,
      art: remote(r.image) ? r.image : `/assets/${r.image}`,
      thumb: remote(r.image) ? (remote(r.thumb) ? r.thumb : '') : (r.image ? `/assets/thumbs/${String(r.image).replace(/\.[^.]+$/, '')}.webp` : ''),
      audio: remote(r.audio) ? r.audio : '',
      spotify: safeLink(r.spotify_link),
      soundcloud: safeLink(r.soundcloud_link),
      applemusic: safeLink(r.applemusic_link || r.apple_music_link || r.applemusic || r.apple_link || r.apple),
      youtubemusic: safeLink(r.youtubemusic_link || r.youtube_music_link || r.ytmusic_link),
      collabLinks: Object.fromEntries(Object.entries(r.collab_links || {}).map(([name, url]) => [name, safeLink(url)]).filter(([, url]) => url)),
      label: r.label
    }));
  }


  const PLAY_ICON = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  const COLLAB_ICON = '<svg class="person-icon" viewBox="0 0 24 24"><path d="M12 2a5 5 0 110 10 5 5 0 010-10zm0 12c4.4 0 8 2.2 8 5v3H4v-3c0-2.8 3.6-5 8-5z"/></svg>';
  const EXT_ICON = '<svg class="ext-icon" viewBox="0 0 24 24"><path d="M7 17L17 7M7 7h10v10" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const ICONS = {
    spotify: '<svg viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.52 17.34c-.24.36-.66.48-1.02.24-2.82-1.74-6.36-2.1-10.56-1.14-.42.12-.78-.18-.9-.54-.12-.42.18-.78.54-.9 4.56-1.02 8.52-.6 11.64 1.32.42.18.48.66.3 1.02zm1.44-3.3c-.3.42-.84.6-1.26.3-3.24-1.98-8.16-2.58-11.94-1.404-.48.12-1.02-.12-1.14-.6-.12-.48.12-1.02.6-1.14C9.6 9.9 15 10.56 18.66 12.78c.36.24.54.78.3 1.26zm.12-3.42C15.84 8.4 9.6 8.16 6 9.3c-.6.18-1.2-.18-1.38-.72-.18-.6.18-1.2.72-1.38 4.2-1.26 11.04-1.02 15.36 1.56.54.3.72 1.02.42 1.56-.3.42-1.02.6-1.56.3z"/></svg>',
    soundcloud: '<svg viewBox="0 0 24 24"><path d="M1.5 15.5h.9v-5.4h-.9v5.4zm2.1.4h.9V8.4h-.9v7.5zm2.1.3h.9V6.6h-.9v9.6zm2.1.1h.9V9.1h-.9v7.2zm2.2.1h.9V4.8h-.9v11.6zm2.3 0h1V2.7c-.27-.1-.55-.16-.85-.18-.34 6-.15 12.1-.15 13.9zm2.4-.1c1.97.32 4.05-.16 5.5-1.6 1.13-1.13 1.7-2.53 1.7-4.15 0-3.3-2.5-5.85-5.7-5.85-.46 0-.9.06-1.32.16-.27.07-.34.15-.34.42v10.7c0 .2.06.27.16.32z"/></svg>',
    apple: '<svg viewBox="0 0 24 24"><circle class="am-ring" cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path class="am-stem" d="M9.5 16.2V9.8c0-.3.2-.5.45-.56l4.3-1.1c.3-.08.55.13.55.42v5.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle class="am-note" cx="9" cy="16.5" r="1.7" fill="currentColor"/><circle class="am-note" cx="14.3" cy="14.9" r="1.7" fill="currentColor"/></svg>',
    instagram: '<svg viewBox="0 0 24 24"><path d="M12 2.16c3.2 0 3.58.01 4.85.07 3.25.15 4.77 1.69 4.92 4.92.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.15 3.23-1.66 4.77-4.92 4.92-1.27.06-1.64.07-4.85.07s-3.58-.01-4.85-.07c-3.26-.15-4.77-1.7-4.92-4.92-.06-1.27-.07-1.65-.07-4.85s.01-3.58.07-4.85C2.38 3.85 3.9 2.32 7.15 2.23 8.42 2.17 8.8 2.16 12 2.16zM12 0C8.74 0 8.33.01 7.05.07c-4.18.2-6.78 2.8-6.98 6.98C0 8.33 0 8.74 0 12s.01 3.67.07 4.95c.2 4.17 2.8 6.78 6.98 6.98C8.33 24 8.74 24 12 24s3.67-.01 4.95-.07c4.17-.2 6.78-2.8 6.98-6.98.06-1.28.07-1.69.07-4.95s-.01-3.67-.07-4.95c-.2-4.17-2.8-6.78-6.98-6.98C15.67.01 15.26 0 12 0zm0 5.84A6.16 6.16 0 1 0 12 18.16 6.16 6.16 0 0 0 12 5.84zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.41-11.85a1.44 1.44 0 1 0 0 2.88 1.44 1.44 0 0 0 0-2.88z"/></svg>',
    youtube: '<svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31.7 31.7 0 0 0 0 12a31.7 31.7 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31.7 31.7 0 0 0 24 12a31.7 31.7 0 0 0-.5-5.8zM9.6 15.6V8.4l6.3 3.6z"/></svg>',
    youtubemusic: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="4.1" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.4 9.7l4 2.3-4 2.3z" fill="currentColor"/></svg>',
    discord: '<svg viewBox="0 0 24 24"><path d="M20.3 4.4A19.7 19.7 0 0 0 15.4 3c-.2.4-.5.9-.6 1.3a18.3 18.3 0 0 0-5.6 0c-.2-.4-.4-.9-.6-1.3-1.7.3-3.4.8-4.9 1.4C1.2 8.5.5 12.6.8 16.6a19.9 19.9 0 0 0 6 3c.5-.6.9-1.3 1.2-2-.7-.3-1.3-.6-1.9-1 .2-.1.3-.3.5-.4 3.6 1.7 7.5 1.7 11 0l.5.4c-.6.4-1.2.7-1.9 1 .3.7.7 1.4 1.2 2a19.9 19.9 0 0 0 6-3c.4-4.6-.8-8.7-3.1-12.2zM8.5 14.3c-1 0-1.9-1-1.9-2.2s.8-2.2 1.9-2.2 1.9 1 1.9 2.2-.8 2.2-1.9 2.2zm7 0c-1 0-1.9-1-1.9-2.2s.8-2.2 1.9-2.2 1.9 1 1.9 2.2-.8 2.2-1.9 2.2z"/></svg>'
  };

  async function renderCatalogue() {
  const grid = document.getElementById('release-grid');

  // ---------- release detail modal: click a card, see catalog/title/
  // collaborators and a clean "listen on" button grid — built once and
  // reused for whichever card was clicked ----------
  let modalBackdrop = document.getElementById('release-modal-backdrop');
  let releaseModalOpener = null;
  if (!modalBackdrop) {
    modalBackdrop = document.createElement('div');
    modalBackdrop.className = 'release-modal-backdrop';
    modalBackdrop.id = 'release-modal-backdrop';
    modalBackdrop.innerHTML = `
      <div class="release-modal" role="dialog" aria-modal="true" aria-labelledby="release-modal-title">
        <div class="release-modal-art" id="release-modal-art">
          <div class="release-modal-catalog-badge mono" id="release-modal-label"></div>
          <button class="release-modal-close" id="release-modal-close" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="release-modal-body">
          <div class="release-modal-tags">
            <div class="release-modal-imprint mono" id="release-modal-imprint"></div>
          </div>
          <div class="release-modal-title" id="release-modal-title"></div>
          <div class="release-modal-collab" id="release-modal-collab"></div>
          <div class="release-modal-divider"></div>
          <span class="release-modal-listen-label mono">Listen On</span>
          <div class="release-modal-links" id="release-modal-links"></div>
        </div>
      </div>
    `;
    // Closed, the modal is only transparent: inert keeps its close button and
    // "Listen on" links out of the Tab order and the accessibility tree.
    modalBackdrop.inert = true;
    document.body.appendChild(modalBackdrop);

    function closeReleaseModal() {
      if (!modalBackdrop.classList.contains('visible')) return;
      modalBackdrop.classList.remove('visible');
      modalBackdrop.inert = true;
      document.body.style.overflow = '';
      // hand focus back to the card that opened it (keyboard users keep their place)
      const opener = releaseModalOpener;
      releaseModalOpener = null;
      if (opener && opener.isConnected) opener.focus({ preventScroll: true });
    }
    modalBackdrop.querySelector('#release-modal-close').addEventListener('click', closeReleaseModal);
    modalBackdrop.addEventListener('click', (e) => { if (e.target === modalBackdrop) closeReleaseModal(); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modalBackdrop.classList.contains('visible')) closeReleaseModal();
    });
    window.closeReleaseModal = closeReleaseModal;
  }

  // Renders the artist credit line for the modal: solo tracks just show
  // "Neutro"; collabs show the credit exactly as written in releases.json,
  // with any name other than Neutro turned into a link IF releases.json
  // has a matching entry in that release's collab_links — otherwise that
  // name just renders as plain text (nothing breaks if a link is missing).
  // Separators kept as written: "&", "," and "feat." / "ft." / "featuring" (singers),
  // the same ones the admin panel uses to ask for each collaborator's link.
  const CREDIT_SEP = /(\s*(?:&|,|\bfeat\.?(?=\s)|\bft\.?(?=\s)|\bfeaturing\b)\s*)/i;
  function artistCreditHtml(r) {
    const tokens = String(r.artist || 'Neutro').split(CREDIT_SEP);
    if (!tokens.some((t, i) => i % 2 === 0 && t.trim())) return 'Neutro';
    return tokens.map((t, i) => {
      if (i % 2) { const sep = t.trim(); return sep === '&' ? ' &amp; ' : sep === ',' ? ', ' : ` ${escHtml(sep)} `; }
      const name = t.trim();
      if (!name) return '';
      if (name.toLowerCase() === 'neutro') return 'Neutro';
      const link = r.collabLinks && r.collabLinks[name.replace(/[()]/g, '').trim()];
      return link
        ? `<a href="${link}" target="_blank" rel="noopener">${escHtml(name)}</a>`
        : escHtml(name);
    }).join('');
  }

  function openReleaseModal(r) {
    // full artwork on top of the card's light copy (already loaded): no empty frame while it arrives
    const light = lightCovers.get(r.art);
    document.getElementById('release-modal-art').style.backgroundImage = light ? `url(${r.art}), url(${light})` : `url(${r.art})`;
    document.getElementById('release-modal-label').textContent = r.catalog || 'Neutro';
    document.getElementById('release-modal-title').textContent = r.title;

    const collabEl = document.getElementById('release-modal-collab');
    collabEl.style.display = 'block';
    collabEl.innerHTML = artistCreditHtml(r);

    const imprintEl = document.getElementById('release-modal-imprint');
    if (r.label) {
      imprintEl.textContent = '℗ ' + r.label;
      imprintEl.classList.add('visible');
    } else {
      imprintEl.classList.remove('visible');
    }

    let linksHtml = '';
    if (r.spotify) linksHtml += `<a href="${r.spotify}" target="_blank" rel="noopener" style="--brand-rgb:30,215,96"><span class="link-icon">${ICONS.spotify}</span><span class="name">Spotify</span>${EXT_ICON}</a>`;
    if (r.soundcloud) linksHtml += `<a href="${r.soundcloud}" target="_blank" rel="noopener" style="--brand-rgb:255,119,0"><span class="link-icon">${ICONS.soundcloud}</span><span class="name">SoundCloud</span>${EXT_ICON}</a>`;
    if (r.applemusic) linksHtml += `<a href="${r.applemusic}" target="_blank" rel="noopener" style="--brand-rgb:252,69,98"><span class="link-icon apple-music">${ICONS.apple}</span><span class="name">Apple Music</span>${EXT_ICON}</a>`;
    if (r.youtubemusic) linksHtml += `<a href="${r.youtubemusic}" target="_blank" rel="noopener" style="--brand-rgb:255,0,0"><span class="link-icon">${ICONS.youtubemusic}</span><span class="name">YouTube Music</span>${EXT_ICON}</a>`;
    document.getElementById('release-modal-links').innerHTML = linksHtml;

    if (!modalBackdrop.classList.contains('visible')) releaseModalOpener = document.activeElement;
    modalBackdrop.classList.add('visible');
    modalBackdrop.inert = false;
    document.body.style.overflow = 'hidden';
    document.getElementById('release-modal-close').focus({ preventScroll: true });
  }

  function debounce(fn, ms) {
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
  }

  // Picks how many columns the release grid uses based on the actual
  // release count. 3 is the preferred layout, but a perfectly even split
  // beats it when one exists nearby: 8 releases divides exactly into 4+4
  // (nothing left over at all), which reads as more "finished" than
  // 3+3+2 even though neither strands a lone card — so an exact fit at 3
  // or 4 is checked first, preferring whichever is closer to 3 (ties go
  // to the larger, since fuller rows read more natural than more of
  // them). Only when NEITHER divides evenly does it fall back to
  // avoiding a single stranded card (e.g. 7 → 4+3, 10 → 4+4+2) — a
  // remainder of exactly 1 is the one layout that actually looks broken;
  // a shorter-but-not-lone last row reads as normal.
  function bestReleaseColumnCount(n, maxCols) {
    const target = Math.min(4, maxCols);
    if (n <= target) return n || 1;

    // exact fits first, target itself takes priority — only reach for a
    // wider count when 3 doesn't divide evenly but something else does
    if (n % target === 0) return target;
    for (let c = target + 1; c <= maxCols; c++) {
      if (n % c === 0) return c;
    }

    // no perfect fit available — fall back to avoiding a single
    // stranded card instead
    if (n % target !== 1) return target;
    for (let c = target + 1; c <= maxCols; c++) {
      if (n % c !== 1) return c;
    }
    for (let c = target - 1; c >= 2; c--) {
      if (n % c !== 1) return c;
    }
    return target; // rare counts (e.g. 13) can't fully avoid it either way
  }

  function layoutReleaseGrid() {
    const grid = document.getElementById('release-grid');
    if (!grid) return;
    const cards = Array.from(grid.children);
    const n = cards.length;
    if (n === 0) return;
    const gap = 22;
    const minCardWidth = 230;
    const containerWidth = grid.getBoundingClientRect().width;
    if (containerWidth <= 0) return;
    const maxCols = Math.max(1, Math.floor((containerWidth + gap) / (minCardWidth + gap)));
    const cols = bestReleaseColumnCount(n, maxCols);
    const width = (containerWidth - (cols - 1) * gap) / cols;
    cards.forEach((c) => { c.style.flexBasis = width + 'px'; c.style.maxWidth = width + 'px'; });
  }

  // Built into a fragment and appended once at the end — appending inside
  // the loop instead would mean the grid's layout can be invalidated once
  // per card; batching it into a single insertion means it's invalidated
  // once total, no matter how many releases there are.

  const cardsFragment = document.createDocumentFragment();
  RELEASES.forEach((r) => {
    const card = document.createElement('div');
    card.className = 'release-card card';
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    card.setAttribute('aria-label', `View details for ${r.title}`);

    // The entrance reveal is a CSS *animation* (cardReveal, fill-mode
    // forwards) that touches `transform`. A fill-forwards animation keeps
    // outranking any other rule for that property — including the plain
    // CSS :hover rule below — for as long as it's still "filling", even
    // after it's technically finished playing. Dropping the animation once
    // it ends hands `transform` back to the normal cascade so :hover's
    // lift-on-hover actually takes effect.
    card.addEventListener('animationend', (e) => {
      if (e.animationName === 'cardReveal') {
        card.style.animation = 'none';
        card.classList.remove('will-animate');
      }
    });
    // only pay the will-change/composited-layer cost while a transform is
    // actually about to move (entrance reveal or hover) — not for the
    // entire lifetime of the card
    card.addEventListener('mouseenter', () => card.classList.add('will-animate'));
    card.addEventListener('mouseleave', () => card.classList.remove('will-animate'));

    const stage = document.createElement('div');
    stage.className = 'release-art-stage';

    const artImg = document.createElement('div');
    artImg.className = 'release-art-img';
    // cover art is loaded lazily (see the lazy-load observer below) instead
    // of all at once here — with several releases this used to fire a burst
    // of image requests at page load that competed with the hero photo and
    // fonts, so cards near the bottom sat blank for a while after they'd
    // already animated into view
    artImg.dataset.src = r.art;
    if (r.thumb) artImg.dataset.thumb = r.thumb;
    stage.appendChild(artImg);

    if (r.catalog) {
      const badge = document.createElement('div');
      badge.className = 'release-catalog-badge mono';
      badge.textContent = r.catalog;
      stage.appendChild(badge);
    }

    const playHint = document.createElement('div');
    playHint.className = 'release-play-hint';
    playHint.setAttribute('aria-hidden', 'true');
    playHint.innerHTML = `<span>${PLAY_ICON}</span>`;
    stage.appendChild(playHint);

    card.appendChild(stage);

    const meta = document.createElement('div');
    meta.className = 'release-card-meta';
    meta.innerHTML = `<div class="release-title">${escHtml(r.title)}</div><div class="release-artist">${COLLAB_ICON}<span class="artist-text">${artistCreditHtml(r)}</span></div>`;
    // the artist line can contain a real <a> to the collaborator's Spotify
    // profile — stop it from also bubbling up to the card's own click
    // handler, which would otherwise open the release modal at the same time
    meta.querySelectorAll('a').forEach((a) => {
      a.addEventListener('click', (e) => e.stopPropagation());
    });
    card.appendChild(meta);

    card.addEventListener('click', () => openReleaseModal(r));
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openReleaseModal(r); }
    });

    cardsFragment.appendChild(card);
  });
  grid.appendChild(cardsFragment);
  layoutReleaseGrid();


  // ---------- search: title or artist, accents and case ignored ----------
  const fold = (v) => String(v || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const cards = Array.from(grid.children);
  const keys = RELEASES.map((r) => fold(`${r.title} ${r.artist} ${r.catalog || ''}`));
  const countEl = document.getElementById('release-count');
  const emptyEl = document.getElementById('cat-empty');
  const subEl = document.getElementById('cat-sub');
  subEl.textContent = `${RELEASES.length} ${RELEASES.length === 1 ? 'release' : 'releases'} in the catalogue`;
  function applySearch() {
    const words = fold(document.getElementById('cat-q').value).split(/\s+/).filter(Boolean);
    let shown = 0;
    cards.forEach((card, i) => {
      const match = words.every((w) => keys[i].includes(w));
      card.hidden = !match;
      if (match) shown++;
    });
    countEl.textContent = shown;
    document.getElementById('release-word').textContent = shown === 1 ? 'release' : 'releases';
    emptyEl.hidden = shown > 0;
    layoutReleaseGrid();
  }
  document.getElementById('cat-q').addEventListener('input', applySearch);
  applySearch();

  // ---------- lazy-load cover art shortly before each card is scrolled into view ----------
  // fires well ahead of the viewport (600px) so the image has already loaded
  // by the time the reveal animation below plays — no more blank cards
  const artImgs = Array.from(document.querySelectorAll('.release-art-img[data-src]'));
  if ('IntersectionObserver' in window) {
    const imageObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          const el = entry.target;
          const src = el.dataset.src, thumb = el.dataset.thumb;
          delete el.dataset.src; delete el.dataset.thumb;
          imageObserver.unobserve(el);
          // Decode off the main render path first. Setting background-image
          // directly forces the browser to decode the full image inside the
          // same frame it's trying to paint — when several cards cross the
          // 600px trigger zone in one scroll (a fresh tab, nothing cached
          // yet), that's several synchronous decodes stacking up in the
          // same frame, which is exactly the stutter on first arrival at
          // Releases. img.decode() does the decode off that critical path;
          // once it resolves we just set the background, which is then
          // instant. Falls back to the old direct-assign if decode() isn't
          // supported or fails (e.g. a 404).
          loadCover(thumb, src, el).then(url => { el.style.backgroundImage = `url(${url})`; });
        }
      });
    }, { threshold: 0, rootMargin: '600px 0px 600px 0px' });
    artImgs.forEach(el => imageObserver.observe(el));
  } else {
    artImgs.forEach(el => { el.style.backgroundImage = `url(${el.dataset.src})`; delete el.dataset.src; });
  }

  // ---------- scroll-triggered reveal animation for release cards ----------
  const rows = Array.from(document.querySelectorAll('.release-card'));
  if ('IntersectionObserver' in window) {
    let revealBatchIndex = 0;
    const observer = new IntersectionObserver((entries) => {
      // entries can contain several cards at once (a whole row, or more,
      // crossing the line together on a fast first scroll) — stagger by
      // arrival order within that batch instead of by fixed grid position,
      // so a burst of 8+ simultaneous intersections doesn't still end up
      // with 4+ of them sharing the exact same delay (and therefore the
      // exact same animation start frame).
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          const row = entry.target;
          row.style.animationDelay = Math.min(revealBatchIndex, 7) * 0.06 + 's';
          revealBatchIndex++;
          row.classList.add('will-animate');
          row.classList.add('in-view');
          observer.unobserve(row);
        }
      });
      // batch counter resets shortly after, so the next distinct scroll
      // wave (e.g. reaching a much later row) starts staggering from 0
      // again instead of drifting to an ever-longer delay
      clearTimeout(observer._resetTimer);
      observer._resetTimer = setTimeout(() => { revealBatchIndex = 0; }, 400);
      // reveal a little before the card is fully in the viewport (rootMargin
      // extends the trigger zone below the fold) instead of waiting for it
      // to be 15% visible — that extra margin was making cards feel slow
      // to appear on a normal scroll
    }, { threshold: 0, rootMargin: '0px 0px 120px 0px' });
    rows.forEach(row => observer.observe(row));
  } else {
    rows.forEach(row => row.classList.add('in-view'));
  }


  }

  loadReleases()
    .then(renderCatalogue)
    .catch(() => {
      const empty = document.getElementById('cat-empty');
      empty.textContent = 'The catalogue could not be loaded. Please try again later.';
      empty.hidden = false;
    });
})();
</script>
</body>
</html>
