<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page Not Found — Neutro</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Sora:wght@400;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* GitHub Pages serves this page for any missing address, so every URL is absolute. */
  :root { --bg: #04070d; --ink: #eef3fa; --ink-dim: #9fb4cf; --steel: #4f7bb0; --steel-bright: #a8c8ec; --ease: cubic-bezier(.22, 1, .36, 1); }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body { min-height: 100vh; display: flex; align-items: center; background: var(--bg); color: var(--ink); font-family: 'Sora', system-ui, sans-serif; }
  body::before { content: ''; position: fixed; inset: 0; z-index: -1; background: linear-gradient(100deg, rgba(4,7,13,.78), rgba(4,7,13,.48)), url('/hero/hero-desktop.webp') 72% 35% / cover no-repeat; }
  @media (max-width: 767px) { body::before { background-image: linear-gradient(100deg, rgba(4,7,13,.78), rgba(4,7,13,.48)), url('/hero/hero-mobile.webp'); } }
  main { width: 100%; max-width: 1200px; margin: 0 auto; padding: 48px 24px; }
  .eyebrow { font: 500 12px 'JetBrains Mono', monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
  h1 { margin: 16px 0 18px; font: 800 clamp(44px, 9vw, 104px)/.95 'Unbounded', sans-serif; letter-spacing: -.035em; }
  p { max-width: 42ch; color: var(--ink-dim); font-size: 16px; line-height: 1.7; }
  a { display: inline-flex; margin-top: 30px; padding: 15px 28px; border-radius: 12px; background: var(--steel-bright); color: var(--bg); font-size: 14px; font-weight: 700; text-decoration: none; transition: background .3s var(--ease); }
  a:hover { background: var(--ink); }
  a:focus-visible { outline: 2px solid var(--steel-bright); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="eyebrow">404</div>
  <h1>Page Not Found</h1>
  <p>This page doesn't exist or has moved.</p>
  <a href="/">Back to Home</a>
</main>
</body>
</html>
